<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Karabang Hub</title>
    <style>

        body{
         margin: 0;
         font-family: "Poppins", sans-serif;
         min-height: 100vh;
         display: flex;
         flex-direction: column; /* stack vertically */
         justify-content: flex-start; /* start from top */
         align-items: center; /* center horizontally */
         gap: 40px; /* space between main and favorites */
         padding-top: 40px; /* optional padding from top */
         background: linear-gradient(135deg,#ff9ad5,#a18aff,#7ee8fa);
        }

        /* floating icons */

        .note{
            position:absolute;
            font-size:30px;
            opacity:0.6;
            animation: float 5s infinite ease-in-out;
        }

        .note:nth-child(1){top:10%; left:20%;}
        .note:nth-child(2){top:75%; left:15%;}
        .note:nth-child(3){top:30%; left:85%;}
        .note:nth-child(4){top:80%; left:70%;}

        @keyframes float{
            0%{transform:translateY(0);}
            50%{transform:translateY(-20px);}
            100%{transform:translateY(0);}
        }

        /* login card */

        .favorites{
            background:white;
            padding:40px;
            border-radius:20px;
            width:340px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            text-align:center;
        }

        .main{
            background:white;
            padding:40px;
            border-radius:20px;
            width:340px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            margin-bottom:5px;
            color:#6c4cff;
        }

        h2{
            margin-top:0;
            color:#666;
        }

        /* inputs */

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:10px;
            border:1px solid #ddd;
            font-size:14px;
        }

        /* button */

        button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:10px;
            background:linear-gradient(45deg,#ff6ec4,#7873f5);
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.05);
        }

        /* links */

        .links{
            display:flex;
            justify-content:space-between;
            font-size:13px;
            margin-top:5px;
        }

        a{
            text-decoration:none;
            color:#6c4cff;
            font-weight:500;
        }

        .signup{
            margin-top:15px;
        }

    </style>
</head>

<body>

    <div class ="main">
    <h1>Welcome to the Song Hub</h1>
    <p id="welcomeMsg"></p>
    <button id="logoutBtn">Logout</button>
    </div>

    <div class ="favorites">
    <h2>Add Favorite</h2>
    <input type="text" id="favoriteInput" placeholder="Enter favorite item">
    <button id="addFavoriteBtn">Add Favorite</button>
    <h2>Your Favorites</h2>
    <ul id="favoriteList"></ul>
    </div>

    <script type="module" src="hubpage.js"></script>
</body>
</html>
