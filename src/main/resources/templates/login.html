
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KaraBang Login</title>
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body>

<div id="topButtonBar">

    <a href="/login" id="webLogo">
        <img
                src="images/KaraBangLogoRetouched.png"
                alt="KaraBang Logo"
                class="logo-img"
        >
    </a>

    <div id="rightButtons">
        <a href="/signup" class="navButton">Sign Up</a>
    </div>

</div>

<main class="login-wrapper">

    <section class="welcome-card">
        <h2>Welcome to Kara<span>Bang</span></h2>

        <p>
            Sing your favorite songs, track your karaoke scores,
            and build your own music experience.
        </p>

        <div class="mini-box">
            <h3>Popular Tonight</h3>
            <p>Blinding Lights</p>
            <p>Levitating</p>
            <p>Die With A Smile</p>
        </div>
    </section>

    <section class="login-card">

        <h2>Welcome Back</h2>

        <p class="small-text">
            Login to continue your karaoke journey.
        </p>

        <form id="loginForm">

            <label for="username">Username</label>

            <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
            >

            <label for="password">Password</label>

            <div class="password-wrapper">

                <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                >

                <button type="button" id="togglePassword">
                    👁
                </button>

            </div>

            <button type="submit">Login</button>

        </form>

        <p id="loginMessage"></p>

        <div class="links">
            <a href="/forgotpassword">Forgot Password?</a>
            <span>|</span>
            <a href="/signup">Create Account</a>
        </div>

    </section>

</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
