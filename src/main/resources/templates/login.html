<!DOCTYPE html>
<html lang="en">
<head>

    <title>KaraBang Login</title>
    <link rel="stylesheet" href="CSS/login.css">




</head>


<body>

<!-- 🔴 glow -->
<div class="glow glow1"></div>
<div class="glow glow2"></div>

<!-- 🎸 LOTS OF ICONS -->
<div class="icon">🎸</div>
<div class="icon">🎵</div>
<div class="icon">🎤</div>
<div class="icon">🎶</div>
<div class="icon">🎸</div>
<div class="icon">🎵</div>
<div class="icon">🎤</div>
<div class="icon">🎶</div>
<div class="icon">🎸</div>
<div class="icon">🎵</div>
<div class="icon">🎤</div>
<div class="icon">🎶</div>

<div class="login-wrapper">

    <!-- LEFT -->
    <div class="left-panel">
        <h1 class="brand">🎤 Kara<span>Bang</span></h1>
        <p class="subtitle">
            Log in and start singing. Queue songs, explore music,
            and enjoy the full karaoke experience.
        </p>

        <form id="login-form">

            <input id="email" type="email" placeholder="Email" required>

            <input id="password" type="password" placeholder="Password" required>

                <div class="links">
                    <a href="forgot">Forgot Password?</a>
                 </div>

            <button id="loginBtn" type="submit">Login</button>

        </form>

        <p class="signup">
            Don’t have an account? <a href="signup">Sign Up</a>
        </p>

        
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
        <div class="album-card">
            <img src="/artCover/blindingLightsArtCover.jpg">

            <div class="song-title">Blinding Lights</div>
            <div class="artist">The Weeknd</div>

        </div>
    </div>

</div>
<script>
    const songs = [
        {
            title: "Blinding Lights",
            artist: "The Weeknd",
            image: "https://upload.wikimedia.org/wikipedia/en/e/e6/The_Weeknd_-_Blinding_Lights.png"
        },
        {
            title: "Bohemian Rhapsody",
            artist: "Queen",
            image: "https://upload.wikimedia.org/wikipedia/en/9/9f/Bohemian_Rhapsody.png"
        }
    ];

    const songTitle = document.querySelector(".song-title");
    const artist = document.querySelector(".artist");
    const image = document.querySelector(".album-card img");

    let index = 0;

    function changeSong(){
        index = (index + 1) % songs.length;

        songTitle.textContent = songs[index].title;
        artist.textContent = songs[index].artist;
        image.src = songs[index].image;
    }

    setInterval(changeSong, 15000);
</script>


     <script type= "module" src="/js/login.js"></script>
</body>
</html>
