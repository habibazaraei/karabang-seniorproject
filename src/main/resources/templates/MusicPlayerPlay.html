<!DOCTYPE html>
<html>
<link rel="icon" href="/images/KaraBangLogoIcon.ico">
<head>
    <meta charset="UTF-8">
    <title>KaraBang</title>

    <link rel="stylesheet" href="/css/MusicPlayer.css">

</head>

<body>

<div id="backgroundPane">
    <img id="backgroundImage" src="/images/purple_song_selection_background.png">
    <audio id="audio"></audio>
    <div id="tierFloatLayer"></div>
    <div id="subtitle"></div>

    <!-- Top and bottom bars -->
    <div id="topBar">
        <button id="goBack">
            <img id="goBackImg" src="/images/go_back_icon.svg">
        </button>

        <div id="songTitle"></div>

        <button id="heart">
            <img id="heartImg" src="/images/heart_gray_icon.svg">
        </button>
        <button id="settings">
            <img src="/images/settings_icon.svg">
        </button>
    </div>

    <div id="settingsModal">
        <div id="settingsPanel">
            <div class="settingsHeader">
                <h2 class="settingsTitle">Settings</h2>
                <button id="closeSettingsBtn">✕</button>
            </div>
            <div class="settingsContent">
                <div class="settingsSection">
                    <hr class="divider">
                    <div class="settingsRow">
                        <span>Font Size</span><span id="fontSizeLabel">5</span>
                    </div>

                    <input type="range" id="fontSizeSlider" min="3" max="20" step="0.1" value="5">
                </div>

                <hr class="divider">
                <div class="settingsSection">
                    <span>Lyric Color</span> <span id="colorPickerLabel"></span>

                    <div id="lyricColorPicker" class="colorGrid"></div>
                </div>
                <button id="resetPrefsBtn">Reset to defaults</button>
            </div>
        </div>
    </div>

    <div id="dropdownMenu" class="dropdown-menu">
        <!-- Empty for now -->
    </div>

</div>

<div id="bottomBar">
    <button id="playPause">
        <img id="playImg" src="/images/play_icon.svg">
    </button>

    <button id="restart">
        <img id="restartImg" src="/images/restart_icon.svg">
    </button>

    <div id="progressContainer">
        <div id="progress"></div>
    </div>
    <div id="rightControls">
        <div class="volume-container">
            <button id="volumeButton">
                <img id="volumeIcon" src="/images/volume_high_icon.svg">
            </button>
            <input type="range" id="volume" min="0" max="100" value="50">
        </div>
    </div>
</div>

</div>
</div>

<script type="module" src="/js/MusicPlayerPlay.js"></script>

</body>
</html>
