<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/SongSelection.css">
    <title>KaraBang</title>

</head>
<body>
<!-- Top button bar -->
<div id="topButtonBar">
    <div id="webLogo">Karabang</div>

    <div id="rightButtons">
        <div class="dropdown">
            <button id="profile" class="topButton" onclick="toggleDropdown()">
                <img src="/images/blank_profile_icon.svg" alt="Profile">
            </button>

            <div class="dropdown-menu" id="myDropdown">
                <div id="loggedOut">
                    <a href="login">Login</a>
                    <a href="signup">Sign Up</a>
                </div>
                <div id="loggedIn" style="display:none;">
                    <a href="profile">Profile</a>
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
            </div>

            <button id="settings" class="topButton">
                <img src="/images/settings_icon.svg" alt="Settings">
            </button>
        </div>
    </div>
</div>

<script>
    function toggleDropdown() {
       document.getElementById("myDropdown").classList.toggle("show");
   }

   // Close dropdown if user clicks outside of it
   window.addEventListener("click", function (e) {
       // Now checks for the correct button id
       if (!e.target.closest("#profile")) {
           const dropdown = document.getElementById("myDropdown");
           if (dropdown.classList.contains("show")) {
               dropdown.classList.remove("show");
           }
       }
   });
</script>




<div id="mainLayout">

    <!-- Left -->
    <div id="leftPanel">
        <!-- Category bar -->
        <div id="leftTop">
            <!-- Search field -->
            <input type="text" id="searchField" placeholder="Search songs...">
            <div id="categoryBar">
                <button class="categoryButton">Artist <img class="sortIcon" src="/images/AtoZ_icon.svg"></button>
                <button class="categoryButton">Genre <img class="sortIcon" src="/images/AtoZ_icon.svg"></button>
                <button class="categoryButton">Difficulty <img class="sortIcon" src="/images/AtoZ_icon.svg"></button>
                <button class="categoryButton">Language <img class="sortIcon" src="/images/AtoZ_icon.svg" /></button>
                <button class="categoryButton">Favorites <img class="sortIcon" src="/images/AtoZ_icon.svg" /></button>

            </div>
        </div>
        <!-- Song list selection -->
        <div id="songList">
            <div id="scrollTop" class="scrollZone"></div>

            <div id="songListInner" class="songListInner"></div>

            <div id="scrollBottom" class="scrollZone"></div>
        </div>
    </div>
    <audio id="teaserPlayer"></audio>
    <!-- Right -->
    <div id="rightPanel">
        <div id="rightTop"></div>
        <div id="songContainer">
            <img id="songImage" src="/images/questionmark_icon.svg">
            <!-- Selected song info -->
            <div id="songInfo">
                <h3 id="songName"></h3>
                <p id="artistName"></p>
            </div>
            <button id="singButton" disabled>Sing Now</button>
        </div>
    </div>
    <br>
</div>

<script type="module" src="/js/SongSelection.js"></script>

</body>
</html>
