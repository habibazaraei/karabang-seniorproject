<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KaraBang Signup</title>
    <link rel="stylesheet" href="CSS/signup.css">
</head>

<body>

<div class="signup-wrapper">

    <div class="left-panel">
        <h1 class="brand">Kara<span>Bang</span></h1>

        <p class="subtitle">
            Create your account and start your karaoke journey.
        </p>

        <form id="signup-form">
            <input id="username" type="text" placeholder="Username" required>
            <input id="email" type="email" placeholder="Email" required>
            <input id="password" type="password" placeholder="Password" required>

            <button id="signupBtn" type="submit">Sign Up</button>

            <a class="home-link" href="/login">Back to Login</a>
        </form>
    </div>

    <div class="right-panel">
        <div class="album-card">
            <h2>Join KaraBang</h2>
            <p>Save your favorite songs, track your scores, and build your karaoke profile.</p>

            <div class="feature-box">Create your profile</div>
            <div class="feature-box">Save liked songs</div>
            <div class="feature-box">Track your best scores</div>
        </div>
    </div>

</div>

<script type="module" src="JS/signup.js"></script>

</body>
</html>
