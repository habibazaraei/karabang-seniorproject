<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KaraBang Signup</title>
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>

<div id="topButtonBar">
    <img id="webLogo" src="images/KaraBangLogoRetouched.png" alt="KaraBang">

    <div id="rightButtons">
    </div>
</div>

<main class="login-wrapper">

    <section class="login-card">
        <h2>Create Account</h2>
        <p class="small-text">Create your account and start your karaoke journey.</p>

        <form id="signup-form">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Enter username" required>

            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter email" required>

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input id="password" type="password" placeholder="Enter password" required>
                <button type="button" id="togglePassword">👁</button>
            </div>

            <button id="signupBtn" type="submit">Sign Up</button>
        </form>

        <p id="signupMessage"></p>

        <div class="links">
            <a href="/login">Back to Login</a>
            <span>|</span>
            <a href="/forgot">Forgot password?</a>
        </div>
    </section>

</main>

<script type="module" src="JS/signup.js"></script>
</body>
</html>
