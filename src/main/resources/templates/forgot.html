<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KaraBang Forgot Password</title>
    <link rel="stylesheet" href="CSS/forgot.css">
</head>

<body>

<main class="forgot-wrapper">

    <section class="forgot-card">

        <img
                src="images/KaraBangLogoRetouched.png"
                alt="KaraBang Logo"
                class="forgot-logo"
        >

        <h2>Forgot Password?</h2>

        <p class="small-text">
            No worries. Enter your email below and we’ll send you a password reset link.
        </p>

        <form id="reset-form">
            <label for="resetEmail">Email Address</label>

            <input
                    id="resetEmail"
                    type="email"
                    placeholder="Enter your email"
                    required
            >

            <button type="submit">Send Reset Email</button>
        </form>

        <p id="resetMessage"></p>

        <div class="links">
            <a href="/login">Return to Login</a>
            <span>|</span>
            <a href="/signup">Create Account</a>
        </div>

    </section>

</main>

<script type="module" src="js/forgot.js"></script>
</body>
</html>
