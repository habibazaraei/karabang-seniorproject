<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KaraBang - Reset Password</title>
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>

<div id="topButtonBar">
    <img id="webLogo" src="images/KaraBangLogoRetouched.png" alt="KaraBang">

    <div id="rightButtons">
    </div>
</div>

<main class="login-wrapper">

    <section class="login-card">
        <h2>Reset Password</h2>
        <p class="small-text">Enter your email to receive a password reset link.</p>

        <form id="reset-form">
            <label for="resetEmail">Email</label>
            <input id="resetEmail" type="email" placeholder="Enter your email" required>

            <button type="submit">Send Reset Email</button>
        </form>

        <p id="resetMessage"></p>

        <div class="links">
            <a href="/login">Back to Login</a>
            <span>|</span>
            <a href="/signup">Create account</a>
        </div>
    </section>

</main>

<script type="module" src="js/forgot.js"></script>
</body>
</html>



    <script type="module" src="/js/forgot.js"></script>
</body>
</html>
