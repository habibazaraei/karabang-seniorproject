<!DOCTYPE html>
<html lang="en">
<head>
    <title>KaraBang Profile</title>
    <link rel="stylesheet" href="CSS/profilepage.css">
    <meta charset="UTF-8">
</head>
<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="icon">🎸</div>
<div class="icon">🎵</div>
<div class="icon">🎤</div>
<div class="icon">🎶</div>
<div class="icon">🎸</div>
<div class="icon">🎵</div>
<div class="icon">🎤</div>
<div class="icon">🎶</div>
<div class="icon">🎸</div>
<div class="icon">🎵</div>
<div class="icon">🎤</div>
<div class="icon">🎶</div>

<div class="profile-wrapper">

    <!-- LEFT -->
    <div class="left-panel">
        <h1 class="brand">🎤 Kara<span>Bang</span></h1>
        <p class="subtitle">
            Manage your profile, view your favorite songs, and personalize your karaoke experience.
        </p>

        <div class="profile-card">
            <div class="profile-image-section">
                <img id="profileImage" src="/images/blank_profile_icon.svg" alt="Profile Picture">
                <button id="changePhotoBtn" type="button">Change Photo</button>
            </div>

            <form id="profile-form">
                <input id="displayName" type="text" placeholder="Display Name" value="KaraBang User" required>
                <input id="email" type="email" placeholder="Email" value="user@email.com" required>
                <input id="favoriteGenre" type="text" placeholder="Favorite Genre" value="Pop">
                <input id="favoriteArtist" type="text" placeholder="Favorite Artist" value="The Weeknd">

                <div class="profile-buttons">
                    <button id="saveBtn" type="submit">Save Changes</button>
                    <a href="SongSelection.html">
                        <button id="backBtn" type="button">Back to Songs</button>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
        <div class="album-card">
            <img src="https://upload.wikimedia.org/wikipedia/en/e/e6/The_Weeknd_-_Blinding_Lights.png" alt="Album Cover">

            <div class="song-title">Blinding Lights</div>
            <div class="artist">The Weeknd</div>
        </div>

        <div class="scoreboard-card">
            <h2>🏆 Scoreboard</h2>
            <div id="highestScore" class="high-score">0</div>
            <p class="score-label">Highest Score</p>
        </div>

        <div class="favorites-card">
            <h2>⭐ Top 5 Favorited Songs</h2>
            <ul id="favoriteSongsList"></ul>
        </div>
    </div>


<script>
    const songs = [
        {
            title: "Blinding Lights",
            artist: "The Weeknd",
            image: "https://upload.wikimedia.org/wikipedia/en/e/e6/The_Weeknd_-_Blinding_Lights.png"
        },
        {
            title: "Bohemian Rhapsody",
            artist: "Queen",
            image: "https://upload.wikimedia.org/wikipedia/en/9/9f/Bohemian_Rhapsody.png"
        }
    ];

    const songTitle = document.querySelector(".song-title");
    const artist = document.querySelector(".artist");
    const image = document.querySelector(".album-card img");

    let index = 0;

    function changeSong() {
        index = (index + 1) % songs.length;
        songTitle.textContent = songs[index].title;
        artist.textContent = songs[index].artist;
        image.src = songs[index].image;
    }

    setInterval(changeSong, 15000);

    const profileForm = document.getElementById("profile-form");
    profileForm.addEventListener("submit", function(event) {
        event.preventDefault();
        alert("Profile changes saved!");
    });
</script>

<script type="module" src="/js/profilepage.js"></script>
</body>
</html>
