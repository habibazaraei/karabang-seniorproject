<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>
    <style>

        body{
            margin:0;
            font-family: "Poppins", sans-serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#ff9ad5,#a18aff,#7ee8fa);
        }

        /* floating icons */

        .note{
            position:absolute;
            font-size:30px;
            opacity:0.6;
            animation: float 5s infinite ease-in-out;
        }

        .note:nth-child(1){top:10%; left:20%;}
        .note:nth-child(2){top:75%; left:15%;}
        .note:nth-child(3){top:30%; left:85%;}
        .note:nth-child(4){top:80%; left:70%;}

        @keyframes float{
            0%{transform:translateY(0);}
            50%{transform:translateY(-20px);}
            100%{transform:translateY(0);}
        }

        /* forgot pass card */

        .forgot-box{
            background:white;
            padding:40px;
            border-radius:20px;
            width:340px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            
            margin-bottom:px;
            color:#6c4cff;
        }


        /* inputs */

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:10px;
            border:1px solid #ddd;
            font-size:14px;
        }

        /* button */

        button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:10px;
            background:linear-gradient(45deg,#ff6ec4,#7873f5);
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.05);
        }


        a{
            text-decoration:none;
            color:#6c4cff;
            font-weight:500;
        }

        .signup{
            margin-top:15px;
        }

    </style>

</head>
<body>




<div class="note">🎵</div> 
<div class="note">🎶</div>
<div class="note">🎤</div>
<div class="note">🎵</div> 

<div class ="forgot-box">
<h1>Reset Password</h1>
<form id="reset-form">
    <input id="resetEmail" type="email" placeholder="Enter your email" required>

    <button type="submit">Send Reset Email</button>
</form>

</div>

    <script type="module" src="forgot.js"></script>
</body>
</html>
